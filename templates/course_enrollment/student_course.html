<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Students enrolled in {{ course.name }}</h2>
    <ul>
        {% for s in students %}
        <li>{{ s.name }} — {{ s.email }}</li>
        {% empty %}
        <li>No students enrolled yet.</li>
        {% endfor %}
    </ul>


</body>

</html>
